<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz słownictwo: Angielski ↔ Polski (v13)</title>
  <style>
    :root{
      --bg:#f4fbff; --card:#ffffff; --accent:#7dc4ff; --accent-2:#b7f0d9;
      --btn:#ffd778; --btn-hover:#ffcc5c; --ok:#c8f7d0; --bad:#ffd1d1; --text:#123;
      --progress-bg:#eaf7ec; --progress-fill:#34c759; --muted:#6b7b8a; --border:#d7e6ef;
    }
    html,body{height:100%}
    body{margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #eefcff 60%); color:var(--text);}
    .wrap{max-width:960px; margin:0 auto; padding:16px}
    .header{ display:flex; align-items:center; gap:12px; padding:12px 0; }
    .logo{
      width:48px; height:48px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%, var(--accent), var(--accent-2));
      display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
      box-shadow: 0 6px 20px rgba(0,0,0,.12); font-size:26px;
    }
    h1{font-size:22px; margin:0}
    .note{font-size:14px; color:var(--muted); margin-top:2px}
    .card{background:var(--card); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.08); padding:20px; margin-top:10px;}
    .row{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:10px 0}
    label{font-weight:600}
    input[type="text"], input[type="number"]{padding:10px 12px; border-radius:10px; border:1px solid var(--border); min-width:120px}
    select{padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#fff}
    input[type="file"]{padding:8px; background:#fff; border-radius:10px; border:1px dashed #b7d8ee}
    .btn{padding:12px 18px; border:none; border-radius:999px; background:var(--btn); cursor:pointer; font-weight:700; box-shadow:0 6px 0 #f3be4a; transition:.15s}
    .btn:hover{background:var(--btn-hover)}
    .btn:active{transform: translateY(1px); box-shadow:0 5px 0 #f3be4a}
    .btn-secondary{background:#e9f3ff; box-shadow:none; border:1px solid #cfe1ff}
    .btn-toggle{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer}
    .btn-toggle.active{background:#e6f4ff;border-color:#9fd2ff;font-weight:700}
    .chip{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px}
    .pill{padding:6px 10px; border-radius:999px; background:#eef7ff; font-size:12px; border:1px solid #d9ecff}
    .hidden{display:none}
    .question{font-size:22px; font-weight:800; margin:8px 0 14px}
    .answers{display:grid; gap:10px}
    .answers button{
      text-align:left; padding:12px 14px; border-radius:14px; border:2px solid #e6eef5; background:#f9fcff; cursor:pointer; font-size:16px;
      box-shadow: 0 3px 0 #d8e6f2;
    }
    .answers button.ok{background:var(--ok); border-color:#90e3a1}
    .answers button.bad{background:var(--bad); border-color:#f19999}
    #spellingInput { font-size: 18px; padding: 15px; border-radius: 12px; border: 2px solid var(--border); width: 100%; box-sizing: border-box; }
    #spellingInput.ok { background: var(--ok); }
    #spellingInput.bad { background: var(--bad); }
    .spelling-hint { font-size: 16px; font-weight: bold; margin-top: 10px; color: #d00; }
    .hud{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0 12px}
    .hud .bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
    .badge{padding:6px 10px; border-radius:10px; background:#f0fbff; border:1px solid #cfe9fb; font-weight:700}
    .timer{font-variant-numeric: tabular-nums; font-weight:800}
    .progress{height:14px; background:var(--progress-bg); border-radius:999px; overflow:hidden; border:1px solid #dbeadf}
    .progress .fill{height:100%; width:0%; background:var(--progress-fill); transition:width .25s ease;}
    .review-item{padding:8px 0; border-bottom:1px dashed #e6eef5}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">🙂</div>
      <div>
        <h1>Czas na quiz ze słówek!</h1>
        <div class="note">Format CSV: <code>english,polish</code>.</div>
      </div>
    </div>

    <div class="card" id="startCard">
      <div class="row">
        <label>Imię zawodnika</label>
        <input type="text" id="playerName" placeholder="np. Zosia" />
      </div>
      <div class="row">
        <label>Wybierz plik CSV</label>
        <input type="file" id="csvFile" accept=".csv,text/csv" />
        <span class="pill" id="poolInfo">Wczytaj plik</span>
      </div>
      <div class="row">
        <label>Kierunek</label>
        <select id="direction">
          <option value="both">Oba</option>
          <option value="enpl">Angielski → Polski</option>
          <option value="plen">Polski → Angielski</option>
        </select>
      </div>
      <div class="row">
        <label>Tryb gry</label>
        <button class="btn-toggle btn-mode active" data-mode="standard">Standard (liczba pytań)</button>
        <button class="btn-toggle btn-mode" data-mode="challenge">Wyzwanie (na czas)</button>
      </div>
      <div class="row">
        <label>Rodzaj zadania</label>
        <button class="btn-toggle btn-type active" data-type="choice">Wielokrotny wybór</button>
        <button class="btn-toggle btn-type" data-type="spelling">Pisownia (wpisywanie)</button>
      </div>
      <div class="row" id="standardControls">
        <label>Liczba pytań</label>
        <select id="questionCount">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="all">Wszystkie</option>
        </select>
      </div>
      <div class="row hidden" id="challengeControls">
        <label>Czas (mm:ss lub sekundy)</label>
        <button class="chip" onclick="setTime(60)">1:00</button>
        <button class="chip" onclick="setTime(180)">3:00</button>
        <button class="chip" onclick="setTime(300)">5:00</button>
        <input type="text" id="challengeTime" value="1:00" style="width:100px" placeholder="np. 15:00">
      </div>
      <div class="row">
        <label>Przerwa po odpowiedzi (sekundy)</label>
        <input type="number" id="delaySeconds" value="2" step="0.5" min="0">
      </div>
      <div class="row">
        <button class="btn" id="startBtn">Start quizu</button>
      </div>
    </div>

    <div class="card hidden" id="quizCard">
      <div class="hud">
        <div class="bar">
          <span class="badge">Pytanie <span id="qIndex">1</span>/<span id="qTotal">1</span></span>
          <span class="badge">Wynik: <span id="score">0</span></span>
        </div>
        <div class="badge timer" id="timer">00:00</div>
      </div>
      <div class="progress"><div class="fill" id="progressFill"></div></div>
      <hr style="border:none; height:1px; background:#e9f2f7; margin:15px 0">
      <div class="question" id="questionText">—</div>
      <div class="answers" id="answersBox"></div>
      <div id="spellingBox" class="hidden">
        <input type="text" id="spellingInput" placeholder="Wpisz odpowiedź..." autocomplete="off">
        <div id="spellingHint" class="spelling-hint hidden"></div>
        <button class="btn" id="submitSpelling" style="margin-top:15px; width:100%">Sprawdź (Enter)</button>
      </div>
    </div>

    <div class="card hidden" id="summaryCard">
      <div class="summary" id="summaryText" style="font-size:18px; font-weight:800">Wynik: —</div>
      <div class="row">
        <button class="btn" id="playAgainBtn">Zagraj ponownie</button>
        <button class="btn btn-secondary" id="showReviewBtn">Pokaż poprawne odpowiedzi</button>
      </div>
      <div id="reviewContainer" class="hidden">
        <h3>✅ Poprawne odpowiedzi</h3>
        <div id="reviewList" class="review-list"></div>
      </div>
    </div>

    <div class="card" id="resultsCard">
      <h3>📊 Historia wyników</h3>
      <table style="width:100%; border-collapse:collapse; font-size:14px">
        <thead><tr style="text-align:left; background:#f6fbff"><th>Data</th><th>Imię</th><th>Wynik</th><th>Czas</th></tr></thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

<script>
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const fmtTime = s => { const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); };
const normalize = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l").trim();

let audioCtx=null;
const ensureAudio = () => { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); };
const tone = (f,d,t='sine',g=0.06) => { ensureAudio(); const o=audioCtx.createOscillator(), s=audioCtx.createGain(); o.type=t; o.frequency.value=f; s.gain.value=g; o.connect(s).connect(audioCtx.destination); o.start(); setTimeout(()=>o.stop(), d*1000); };
const sOK = () => { tone(880,0.12); setTimeout(()=>tone(1320,0.12),130); };
const sBAD = () => tone(220,0.2,'square',0.05);
const sWIN = () => { tone(523,0.18,'triangle'); setTimeout(()=>tone(659,0.18,'triangle'),180); setTimeout(()=>tone(784,0.35,'triangle'),360); };

let WORDS=[], QUIZ=[], MODE='standard', Q_TYPE='choice', DIRECTION='both';
let current=0, score=0, elapsed=0, timerInt=null, review=[];

function setTime(s) { $('#challengeTime').value = fmtTime(s); saveSettings(); }

const saveSettings = () => {
  localStorage.setItem('quiz_v13_settings', JSON.stringify({
    name: $('#playerName').value, dir: $('#direction').value,
    mode: MODE, type: Q_TYPE, count: $('#questionCount').value,
    cTime: $('#challengeTime').value, delay: $('#delaySeconds').value,
    words: WORDS
  }));
};

const loadSettings = () => {
  const s = JSON.parse(localStorage.getItem('quiz_v13_settings'));
  if(!s) return;
  $('#playerName').value = s.name || '';
  $('#direction').value = s.dir || 'both';
  $('#questionCount').value = s.count || '10';
  $('#challengeTime').value = s.cTime || '1:00';
  $('#delaySeconds').value = s.delay || '2';
  if(s.words && s.words.length) { WORDS = s.words; $('#poolInfo').textContent = `Słówek: ${WORDS.length}`; }
  if(s.mode) {
    MODE = s.mode;
    $$('.btn-mode').forEach(b => b.classList.toggle('active', b.dataset.mode === MODE));
    $('#standardControls').classList.toggle('hidden', MODE !== 'standard');
    $('#challengeControls').classList.toggle('hidden', MODE !== 'challenge');
  }
  if(s.type) {
    Q_TYPE = s.type;
    $$('.btn-type').forEach(b => b.classList.toggle('active', b.dataset.type === Q_TYPE));
  }
};

function buildQuestion(dirPref){
  const w = WORDS[Math.floor(Math.random()*WORDS.length)];
  const dir = (dirPref==='both') ? (Math.random()<0.5 ? 'enpl' : 'plen') : dirPref;
  return { q: (dir==='enpl') ? w.english : w.polish, correct: (dir==='enpl') ? w.polish : w.english, targetLang: (dir==='enpl') ? 'polish' : 'english' };
}

function renderQuestion(){
  const q = (MODE==='standard') ? QUIZ[current] : buildQuestion(DIRECTION);
  renderQuestion._cur = q;
  $('#questionText').textContent = q.q;
  $('#qIndex').textContent = (MODE==='standard') ? current+1 : '—';
  $('#score').textContent = (MODE==='challenge') ? `${score}/${review.length}` : score;

  if(Q_TYPE === 'choice'){
    $('#answersBox').classList.remove('hidden'); $('#spellingBox').classList.add('hidden');
    const langPool = [...new Set(WORDS.map(x => q.targetLang === 'polish' ? x.polish : x.english))];
    const wrongs = langPool.filter(x => normalize(x) !== normalize(q.correct)).sort(() => 0.5 - Math.random()).slice(0,3);
    const opts = [q.correct, ...wrongs].sort(() => 0.5 - Math.random());
    $('#answersBox').innerHTML = opts.map(o => `<button onclick="checkAnswer('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('');
  } else {
    $('#answersBox').classList.add('hidden'); $('#spellingBox').classList.remove('hidden');
    $('#spellingInput').value = ''; $('#spellingInput').className = ''; $('#spellingInput').disabled = false;
    $('#spellingHint').classList.add('hidden'); $('#spellingInput').focus();
  }
}

function checkAnswer(val){
  const q = renderQuestion._cur;
  const normVal = normalize(val);
  const correctMeanings = q.correct.split('/').map(m => normalize(m.trim()));
  const isCorrect = correctMeanings.includes(normVal) || normalize(q.correct) === normVal;

  if(Q_TYPE === 'choice'){
    $$('#answersBox button').forEach(b => { 
      b.onclick = null; 
      if(normalize(b.textContent) === normalize(q.correct)) b.classList.add('ok'); 
      else if(normalize(b.textContent) === normVal && !isCorrect) b.classList.add('bad'); 
    });
  } else {
    $('#spellingInput').disabled = true;
    if(isCorrect) $('#spellingInput').classList.add('ok'); else { $('#spellingInput').classList.add('bad'); $('#spellingHint').textContent = `Poprawnie: ${q.correct}`; $('#spellingHint').classList.remove('hidden'); }
  }

  if(isCorrect){ score++; sOK(); } else { sBAD(); }
  review.push({q: q.q, correct: q.correct, ok: isCorrect});

  setTimeout(() => {
    if(MODE === 'standard'){
      current++; $('#progressFill').style.width = (current/QUIZ.length*100) + '%';
      if(current >= QUIZ.length) finishQuiz(); else renderQuestion();
    } else renderQuestion();
  }, parseFloat($('#delaySeconds').value)*1000);
}

function finishQuiz(){ clearInterval(timerInt); sWIN(); $('#quizCard').classList.add('hidden'); $('#summaryCard').classList.remove('hidden'); const total = (MODE==='standard') ? QUIZ.length : review.length; $('#summaryText').textContent = `${$('#playerName').value}: ${score}/${total} (${fmtTime(elapsed)})`; const h = JSON.parse(localStorage.getItem('quiz_v13_history') || '[]'); h.push({date: new Date().toLocaleString(), name: $('#playerName').value, score: `${score}/${total}`, time: fmtTime(elapsed)}); localStorage.setItem('quiz_v13_history', JSON.stringify(h)); renderHistory(); $('#reviewList').innerHTML = review.map(r => `<div class="review-item" style="color:${r.ok?'#28a745':'#dc3545'}">${r.q} → ${r.correct}</div>`).join(''); }
function renderHistory(){ const h = JSON.parse(localStorage.getItem('quiz_v13_history') || '[]'); $('#resultsBody').innerHTML = h.reverse().slice(0,5).map(r => `<tr><td>${r.date}</td><td>${r.name}</td><td>${r.score}</td><td>${r.time}</td></tr>`).join(''); }

$$('.btn-mode').forEach(b => b.onclick = () => { MODE=b.dataset.mode; $$('.btn-mode').forEach(x=>x.classList.remove('active')); b.classList.add('active'); $('#standardControls').classList.toggle('hidden', MODE!=='standard'); $('#challengeControls').classList.toggle('hidden', MODE!=='challenge'); saveSettings(); });
$$('.btn-type').forEach(b => b.onclick = () => { Q_TYPE=b.dataset.type; $$('.btn-type').forEach(x=>x.classList.remove('active')); b.classList.add('active'); saveSettings(); });

$('#startBtn').onclick = () => {
  ensureAudio(); if(!WORDS.length) return alert("Wczytaj plik!");
  saveSettings();
  DIRECTION = $('#direction').value;
  score = 0; current = 0; review = []; elapsed = 0;
  $('#startCard').classList.add('hidden'); $('#quizCard').classList.remove('hidden');
  
  if(MODE === 'standard'){
    const count = $('#questionCount').value === 'all' ? WORDS.length : parseInt($('#questionCount').value);
    QUIZ = Array.from({length: count}, () => buildQuestion(DIRECTION));
    $('#qTotal').textContent = QUIZ.length;
    timerInt = setInterval(() => { elapsed++; $('#timer').textContent = fmtTime(elapsed); }, 1000);
  } else {
    let rawTime = $('#challengeTime').value;
    let seconds = 60;
    if(rawTime.includes(':')){ let [m,s] = rawTime.split(':'); seconds = (parseInt(m)||0)*60 + (parseInt(s)||0); } else { seconds = parseInt(rawTime)||60; }
    let left = seconds;
    const startLeft = left;
    timerInt = setInterval(() => { left--; elapsed++; $('#timer').textContent = fmtTime(left); $('#progressFill').style.width = (left/startLeft*100) + '%'; if(left <= 0) finishQuiz(); }, 1000);
  }
  renderQuestion();
};

$('#csvFile').onchange = (e) => {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const lines = ev.target.result.split(/\r?\n/).filter(l => l.includes(','));
    const headers = lines[0].toLowerCase().split(',');
    const eIdx = headers.indexOf('english'), pIdx = headers.indexOf('polish');
    WORDS = lines.slice(1).map(l => { const c = l.split(','); return {english: c[eIdx]?.trim(), polish: c[pIdx]?.trim()}; }).filter(w => w.english && w.polish);
    $('#poolInfo').textContent = `Słówek: ${WORDS.length}`;
    saveSettings();
  };
  reader.readAsText(e.target.files[0]);
};

$('#submitSpelling').onclick = () => checkAnswer($('#spellingInput').value);
$('#spellingInput').onkeydown = (e) => { if(e.key==='Enter') checkAnswer(e.target.value); };
$('#playAgainBtn').onclick = () => location.reload();
$('#showReviewBtn').onclick = () => $('#reviewContainer').classList.toggle('hidden');

loadSettings();
renderHistory();
</script>
</body>
</html>
